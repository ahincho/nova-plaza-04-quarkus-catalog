quarkus.application.name=plaza-catalog
quarkus.http.port=8082
quarkus.http.test-port=0

# Las credenciales de la base salen de Vault (ADR-049): el secreto trae DB_URL, DB_USERNAME y DB_PASSWORD.
# La dirección y el token de Vault llegan por VAULT_ADDR y VAULT_TOKEN. Las pruebas no usan Vault: Quarkus levanta
# su propio Postgres con Dev Services.
%dev.nova.secrets.import=vault:plaza/catalog/db
%prod.nova.secrets.import=vault:plaza/catalog/db
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DB_URL}
%dev.quarkus.datasource.username=${DB_USERNAME}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# El esquema lo dicen las migraciones de Flyway, no las entidades.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Una reserva aparta el stock diez minutos (ADR-043).
plaza.catalog.reservation-ttl=PT10M

# Trazas, logs y métricas por OTLP al Collector de nova-shared-03-infrastructure.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=true
%test.quarkus.otel.sdk.disabled=true
