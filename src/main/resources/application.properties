quarkus.application.name=plaza-catalog
quarkus.http.port=8082
quarkus.http.test-port=0

# Las credenciales de la base salen de Vault (ADR-049): el secreto trae DB_URL, DB_USERNAME y DB_PASSWORD.
# La dirección y el token de Vault llegan por VAULT_ADDR y VAULT_TOKEN. Las pruebas no usan Vault: Quarkus levanta
# su propio Postgres con Dev Services.
%dev.nova.secrets.import=vault:plaza/catalog/db
%prod.nova.secrets.import=vault:plaza/catalog/db
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DB_URL}
%dev.quarkus.datasource.username=${DB_USERNAME}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# El esquema lo dicen las migraciones de Flyway, no las entidades.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Una reserva aparta el stock diez minutos (ADR-043).
plaza.catalog.reservation-ttl=PT10M

# Trazas, logs y métricas por OTLP al Collector de nova-shared-03-infrastructure.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=true
%test.quarkus.otel.sdk.disabled=true

# Los eventos de pedidos (ADR-048): Debezium los publica en plaza.orders, y el catálogo suma al ranking cada pedido
# confirmado. Un evento que no se puede procesar detiene el consumo en vez de saltarse. La salud de Kafka no entra
# en la disponibilidad: sin Kafka el catálogo sigue reservando, y el ranking se pone al día cuando vuelve.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.orders.connector=smallrye-kafka
mp.messaging.incoming.orders.topic=plaza.orders
mp.messaging.incoming.orders.group.id=plaza-catalog
mp.messaging.incoming.orders.auto.offset.reset=earliest
mp.messaging.incoming.orders.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders.failure-strategy=fail
mp.messaging.incoming.orders.health-readiness-enabled=false
# Kafka es el del compose de Plaza, no uno de Dev Services. Las pruebas llaman al consumidor directamente.
quarkus.kafka.devservices.enabled=false
%test.mp.messaging.incoming.orders.enabled=false
